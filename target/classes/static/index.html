<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>卡号登录系统</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 32px 32px 24px 32px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            width: 340px;
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .button-group button {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        #loginBtn { background: #4CAF50; }
        #unbindBtn { background: #f44336; }
        #queryBtn { background: #2196F3; }
        #registerBtn { background: #ff9800; }
        .message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>
<div class="container">
    <h2>卡号登录系统</h2>
    <div class="input-group">
        <input type="text" id="username" placeholder="用户名" maxlength="32">
    </div>
    <div class="input-group">
        <input type="password" id="password" placeholder="密码" maxlength="32">
    </div>
    <div class="input-group">
        <input type="text" id="cardNumber" placeholder="卡号（6-12位数字）" maxlength="12">
    </div>
    <div class="button-group">
        <button id="loginBtn" onclick="login()">登录</button>
        <button id="unbindBtn" onclick="unbind()">解绑</button>
        <button id="queryBtn" onclick="query()">查询</button>
    </div>
    <button id="registerBtn" onclick="register()" style="width:100%;margin-bottom:10px;">注册</button>
    <div id="message" class="message"></div>
</div>
<script>
    // 设备指纹生成
    function getDeviceFingerprint() {
        return btoa(navigator.userAgent + window.screen.width + window.screen.height + new Date().getTimezoneOffset());
    }

    function showMessage(msg, type) {
        const el = document.getElementById('message');
        el.innerText = msg;
        el.className = 'message ' + (type === 'success' ? 'success' : 'error');
        el.style.display = 'block';
    }

    function clearMessage() {
        const el = document.getElementById('message');
        el.innerText = '';
        el.style.display = 'none';
    }

    function getInput() {
        return {
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value.trim(),
            cardNumber: document.getElementById('cardNumber').value.trim(),
            deviceFingerprint: getDeviceFingerprint()
        };
    }

    async function login() {
        clearMessage();
        const {username, password, cardNumber, deviceFingerprint} = getInput();
        if (!/^[0-9]{6,12}$/.test(cardNumber)) {
            showMessage('卡号必须是6-12位数字', 'error');
            return;
        }
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Device-Fingerprint': deviceFingerprint
            },
            body: JSON.stringify({username, password, cardNumber})
        });
        const data = await res.json();
        if (data.code === 0) {
            showMessage('登录成功，Token: ' + data.data, 'success');
            localStorage.setItem('token', data.data);
        } else {
            showMessage(data.message, 'error');
        }
    }

    async function register() {
        clearMessage();
        const {username, password, cardNumber, deviceFingerprint} = getInput();
        if (!/^[0-9]{6,12}$/.test(cardNumber)) {
            showMessage('卡号必须是6-12位数字', 'error');
            return;
        }
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password, cardNumber, boundDeviceFingerprint: deviceFingerprint})
        });
        const data = await res.json();
        if (data.code === 0) {
            showMessage('注册成功', 'success');
        } else {
            showMessage(data.message, 'error');
        }
    }

    async function unbind() {
        clearMessage();
        const {username, password, cardNumber} = getInput();
        const res = await fetch('/api/unbind', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password, cardNumber})
        });
        const data = await res.json();
        if (data.code === 0) {
            showMessage('解绑成功', 'success');
        } else {
            showMessage(data.message, 'error');
        }
    }

    async function query() {
        clearMessage();
        const cardNumber = document.getElementById('cardNumber').value.trim();
        if (!/^[0-9]{6,12}$/.test(cardNumber)) {
            showMessage('卡号必须是6-12位数字', 'error');
            return;
        }
        const token = localStorage.getItem('token') || '';
        const res = await fetch('/api/query/' + cardNumber, {
            method: 'GET',
            headers: {'Authorization': 'Bearer ' + token}
        });
        const data = await res.json();
        if (data.code === 0) {
            showMessage('查询成功：' + JSON.stringify(data.data), 'success');
        } else {
            showMessage(data.message, 'error');
        }
    }
</script>
</body>
</html>
